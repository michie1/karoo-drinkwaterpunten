name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Publish Karoo SDK locally
        run: |
          git clone --depth 1 --branch 1.1.9 https://github.com/hammerheadnav/karoo-ext.git "$RUNNER_TEMP/karoo-ext"
          "$RUNNER_TEMP/karoo-ext/gradlew" -p "$RUNNER_TEMP/karoo-ext" lib:publishToMavenLocal
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Test and build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test assembleRelease
      - name: Prepare files
        run: |
          cp app/build/outputs/apk/release/app-release.apk drinkwaterpunten.apk
          sha256sum drinkwaterpunten.apk > drinkwaterpunten.apk.sha256
          cp docs/icon.png drinkwaterpunten.png
          jq -e . manifest.json > /dev/null
          test "$(jq -r .latestVersion manifest.json)" = "${GITHUB_REF_NAME#v}"
          test "$(jq -r .latestVersion manifest.json)" = "$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          test "$(jq -r .latestVersionCode manifest.json)" = "$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" drinkwaterpunten.apk drinkwaterpunten.apk.sha256 drinkwaterpunten.png manifest.json --generate-notes
